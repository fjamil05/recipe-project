services:
  mariadb:
    image: mariadb:11.4
    container_name: recipe-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: recipe_tracker
      MARIADB_USER: recipe_user
      MARIADB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: