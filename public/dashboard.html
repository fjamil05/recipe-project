
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Tasks - Recipe Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

    <nav class="dashboard-nav">
        <a href="dashboard.html" class="active">Weekly Tasks</a>
        <a href="boards.html">Boards</a>
        <a href="search.html">Search</a>
    </nav>

    <main class="dashboard-container">
        <h1>Weekly Tasks</h1>

        <section class="week-header">
            <button type="button" aria-label="Previous week">
                &#10094;
            </button>

            <h2>This Week</h2>

            <button type="button" aria-label="Next week">
                &#10095;
            </button>
        </section>

        <section class="task-board">
            <div class="task-column">
                <h3>Monday</h3>
                <div class="task-card">
                    <p>Breakfast</p>
                    <span>Prepare Pancakes</span>
                </div>
            </div>

            <div class="task-column">
                <h3>Tuesday</h3>
                <div class="task-card">
                    <p>Dinner</p>
                    <span>Make Pasta</span>
                </div>
            </div>

            <div class="task-column">
                <h3>Wednesday</h3>
                <div class="task-card">
                    <p>Lunch</p>
                    <span>Prepare Salad</span>
                </div>
            </div>

            <div class="task-column">
                <h3>Thursday</h3>
            </div>

            <div class="task-column">
                <h3>Friday</h3>
            </div>

            <div class="task-column">
                <h3>Saturday</h3>
            </div>

            <div class="task-column">
                <h3>Sunday</h3>
            </div>
        </section>

        <section class="team-section">
            <h2>Team Members</h2>

            <div class="team-members">
                <div class="member">
                    <div class="member-avatar">A</div>
                    <p>User 1</p>
                </div>

                <div class="member">
                    <div class="member-avatar">B</div>
                    <p>User 2</p>
                </div>

                <div class="member">
                    <div class="member-avatar">C</div>
                    <p>User 3</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
