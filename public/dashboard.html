
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Tasks - Recipe Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

    
<nav class="dashboard-nav">
    <a href="dashboard.html" class="active">Weekly Tasks</a>
    <a href="boards.html">Boards</a>
    <a href="search.html">Search</a>

    <!-- User Profile Menu -->
    <div class="profile-menu">

        <button
            type="button"
            id="profile-menu-button"
            class="profile-menu-button"
            aria-label="Open profile menu"
            aria-expanded="false"
        >
            <span id="profile-avatar" class="profile-avatar">U</span>
        </button>

        <div id="profile-dropdown" class="profile-dropdown" hidden>

            <div class="profile-info">
                <span id="profile-dropdown-avatar" class="profile-avatar">U</span>

                <div class="profile-info-text">
                    <strong id="profile-display-name">User</strong>
                    <span>My Account</span>
                </div>
            </div>

            <hr>

            <button type="button" id="edit-display-name">
                Edit Display Name
            </button>

            
        <button type="button" id="change-profile-picture">
            Change Profile Picture
        </button>

        <input
        type="file"
        id="profile-picture-input"
        accept="image/*"
        hidden
        >

<button type="button" id="remove-profile-picture" hidden>
    Remove Profile Picture
</button>


            <hr>

            <button type="button" id="logout-button">
                Log Out
            </button>

        </div>

</nav>


    <main class="dashboard-container">
        <h1>Weekly Tasks</h1>

    <section class="week-header">
        <button type="button" id="previous-week" aria-label="Previous week">
            &#10094;
        </button>

        <h2 id="current-week">This Week</h2>

        <button type="button" id="next-week" aria-label="Next week">
            &#10095;
        </button>
    </section>

        <section class="task-board">
    <div class="task-column">
    <h3>Monday</h3>

    <div class="planned-recipes"></div>

    <button type="button" class="add-planned-recipe">
        + Add Recipe
    </button>
</div>

    <div class="task-column">
    <h3>Tuesday</h3>

    <div class="planned-recipes"></div>

    <button type="button" class="add-planned-recipe">
        + Add Recipe
    </button>
</div>

    <div class="task-column">
    <h3>Wednesday</h3>

    <div class="planned-recipes"></div>

    <button type="button" class="add-planned-recipe">
        + Add Recipe
    </button>
</div>

    <div class="task-column">
    <h3>Thursday</h3>

    <div class="planned-recipes"></div>

    <button type="button" class="add-planned-recipe">
        + Add Recipe
    </button>
</div>

   <div class="task-column">
    <h3>Friday</h3>

    <div class="planned-recipes"></div>

    <button type="button" class="add-planned-recipe">
        + Add Recipe
    </button>
</div>

    <div class="task-column">
    <h3>Saturday</h3>

    <div class="planned-recipes"></div>

    <button type="button" class="add-planned-recipe">
        + Add Recipe
    </button>
</div>

    <div class="task-column">
    <h3>Sunday</h3>

    <div class="planned-recipes"></div>

    <button type="button" class="add-planned-recipe">
        + Add Recipe
    </button>
</div>
</section>


<section class="planner-recipe-form" id="planner-recipe-form" hidden>
    <h2>Add Recipe to Planner</h2>

    <form id="add-planner-recipe-form">
        <label for="planner-recipe-select">
            Select Recipe
        </label>

        <select id="planner-recipe-select" required>
            <option value="">Choose a recipe</option>
        </select>

        <div class="board-form-buttons">
            <button type="submit" class="create-board-button">
                Add Recipe
            </button>

            <button type="button" id="cancel-planner-recipe">
                Cancel
            </button>
        </div>
    </form>
</section>


<section class="planner-recipe-form" id="edit-planner-form" hidden>
    <h2>Reschedule Recipe</h2>

    <form id="edit-planner-recipe-form">

        <label for="edit-planner-date">
            Scheduled Date
        </label>

        <input
            type="date"
            id="edit-planner-date"
            required
        >

        <div class="board-form-buttons">
            <button type="submit" class="create-board-button">
                Save Changes
            </button>

            <button type="button" id="cancel-planner-edit">
                Cancel
            </button>
        </div>

    </form>
</section>

        
<!-- Collaborators Section -->
<section class="team-section">
    <h2>Collaborators</h2>

    <div class="team-members">

        <div class="member">
            <div class="member-avatar">A</div>
            <p>Alex</p>
        </div>

        <div class="member">
            <div class="member-avatar">B</div>
            <p>Blake</p>
        </div>

        <div class="member">
            <div class="member-avatar">C</div>
            <p>Casey</p>
        </div>

    </div>
</section>

    </main>

    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/profileMenu.js"></script>
</body>
</html>
