
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boards - Recipe Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

    <nav class="dashboard-nav">
        <a href="dashboard.html">Weekly Tasks</a>
        <a href="boards.html" class="active">Boards</a>
        <a href="search.html">Search</a>
    </nav>

    <main class="boards-container">

        <h1>My Recipe Boards</h1>

        <div class="boards-toolbar">
            <p>Organize your favorite recipes!</p>
            <button type="button" class="create-board-button">
                + Create Board
            </button>
        </div>

        <section class="boards-grid">

            <article class="board-card">
                <div class="board-image">🍳</div>
                <div class="board-info">
                    <h2>Breakfast Favorites</h2>
                    <p>8 Recipes</p>
                    <span class="board-visibility">Private</span>
                </div>
            </article>

            <article class="board-card">
                <div class="board-image">🍝</div>
                <div class="board-info">
                    <h2>Family Dinners</h2>
                    <p>12 Recipes</p>
                    <span class="board-visibility">Shared</span>
                </div>
            </article>

            <article class="board-card">
                <div class="board-image">🧁</div>
                <div class="board-info">
                    <h2>Desserts</h2>
                    <p>5 Recipes</p>
                    <span class="board-visibility">Private</span>
                </div>
            </article>

            <article class="board-card new-board-card">
                <span>+</span>
                <p>Create a New Board</p>
            </article>

        </section>

    </main>

</body>
</html>
