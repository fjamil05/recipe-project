
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Recipes - Recipe Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

    <nav class="dashboard-nav">
        <a href="dashboard.html">Weekly Tasks</a>
        <a href="boards.html">Boards</a>
        <a href="search.html" class="active">Search</a>

        <div class="profile-menu">

        <button
            type="button"
            id="profile-menu-button"
            class="profile-menu-button"
            aria-label="Open profile menu"
            aria-expanded="false"
        >
            <span id="profile-avatar" class="profile-avatar">U</span>
        </button>

        <div id="profile-dropdown" class="profile-dropdown" hidden>

            <div class="profile-info">
                <span id="profile-dropdown-avatar" class="profile-avatar">U</span>

                <div class="profile-info-text">
                    <strong id="profile-display-name">User</strong>
                    <span>My Account</span>
                </div>
            </div>

            <hr>

            <button type="button" id="edit-display-name">
                Edit Display Name
            </button>

            
        <button type="button" id="change-profile-picture">
            Change Profile Picture
        </button>

        <input
        type="file"
        id="profile-picture-input"
        accept="image/*"
        hidden
        >

<button type="button" id="remove-profile-picture" hidden>
    Remove Profile Picture
</button>


            <hr>

            <button type="button" id="logout-button">
                Log Out
            </button>

        </div>
    </nav>

    <main class="search-container">
        <h1>Search Recipes</h1>

        <section class="search-controls">
            <input
                type="search"
                id="recipe-search"
                placeholder="Search for a recipe..."
                aria-label="Search recipes"
            >
        
        </section>

       
            
<section class="recipe-filters">
    <select id="category-filter" aria-label="Recipe category">
        <option value="">All Categories</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Lunch">Lunch</option>
        <option value="Dinner">Dinner</option>
        <option value="Dessert">Dessert</option>
        <option value="Seafood">Seafood</option>
        <option value="Snack">Snack</option>
        <option value="Other">Other</option>
    </select>

    <select id="difficulty-filter" aria-label="Difficulty">
        <option value="">All Difficulties</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
    </select>

    <select id="time-filter" aria-label="Preparation time">
        <option value="">Any Prep Time</option>
        <option value="15">Under 15 Minutes</option>
        <option value="30">Under 30 Minutes</option>
        <option value="60">Under 60 Minutes</option>
    </select>


    </section>

        <h2 class="results-heading">Recipes</h2>

        <section class="recipe-grid">

            <p id="no-search-results">
                No recipes found.
            </p>

        </section>

        
<section class="recipe-details" id="recipe-details">
    <h2>Recipe Details</h2>

    <div class="details-content">
        <h3 id="detail-name">Select a Recipe</h3>

        <p><strong>Category:</strong>
            <span id="detail-category">-</span>
        </p>

        <p><strong>Cooking Time:</strong>
            <span id="detail-time">-</span>
        </p>

        <p><strong>Difficulty:</strong>
            <span id="detail-difficulty">-</span>
        </p>

        <p><strong>Enjoyment Rating:</strong>
            <span id="detail-rating">-</span>
        </p>

        <h4>Ingredients</h4>
        <ul id="detail-ingredients"></ul>

        

<h4>Instructions</h4>
<ol id="detail-instructions"></ol>

<button type="button" class="save-recipe-button">
    Add to Board
</button>

<div id="save-to-board-panel" class="save-to-board-panel" hidden>
    <h3>Save Recipe</h3>
    <p>Select a location for this recipe.</p>

    <label class="save-destination-option">
    <input type="radio" name="save-destination"
           value="unsorted" checked>
    Unsorted Recipes
</label>

<label class="save-destination-option">
    <input type="radio" name="save-destination"
           value="board">
    Existing Board
</label>

    <div id="save-board-selection" hidden>
        <label for="save-board-select">Select a Board</label>
        <select id="save-board-select"></select>
    </div>

    <p id="save-board-message"></p>

    <div class="board-form-buttons">
        <button type="button" id="confirm-save-board">
            Add to Board
        </button>

        <button type="button" id="cancel-save-board">
            Cancel
        </button>
    </div>
</div>


</div>
</section>


    </main>
    <script type="module" src="js/search.js"></script>
    <script type="module" src="js/recipeDetails.js"></script>
    <script type="module" src="js/profileMenu.js"></script>
</body>
</html>
